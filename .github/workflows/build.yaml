name: Build Dictate APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DevEmperor/DictateKeyboard
          ref: main
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v4
      - run: |
          sdkmanager "ndk;29.0.14206865" "cmake;4.1.2"
      - run: bash tools/fetch-sherpa-onnx.sh
      - run: bash tools/bergamot/build-android.sh arm64-v8a
      - run: sed -i '/dependsOn(verifyBergamotLib)/d' app/build.gradle.kts || true
      - run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: dictate-apk, path: '**/*.apk', retention-days: 5 }
